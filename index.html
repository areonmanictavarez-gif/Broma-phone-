<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Apple Security</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .box {
      max-width: 360px;
      padding: 30px;
      border-radius: 14px;
      background: #111;
      box-shadow: 0 0 25px rgba(255,255,255,0.1);
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .alert {
      color: #ff3b30;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .small {
      font-size: 14px;
      color: #ccc;
    }
    .joke {
      display: none;
      margin-top: 20px;
      font-size: 18px;
      color: #34c759;
      font-weight: 600;
    }
    button {
      margin-top: 20px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: #007aff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="title">Apple Security</div>
    <div class="alert">Actividad maliciosa detectada</div>
    <div class="small">
      Se identificó un proceso desconocido en este iPhone.<br>
      Archivos en riesgo: 14<br>
      Nivel de amenaza: ALTO
    </div>
    <button onclick="mostrarBroma()">Reparar ahora</button>
    <div class="joke" id="joke">😂 Caíste. Era una broma.</div>
  </div>

  <script>
    function mostrarBroma() {
      document.getElementById("joke").style.display = "block";
    }
  </script>
</body>
</html>
